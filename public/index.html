<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli VPN Otomatis - Hitungan Harian QRIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">⚡ Auto VPN Store</h1>
      <p class="text-xs text-slate-400 mt-1">Hitungan harian fleksibel (Rp 300/hari, maks 30 hari)</p>
    </div>

    <!-- FORM INPUT -->
    <div id="formSection" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Username Akun</label>
        <input type="text" id="username" placeholder="Masukkan username..." class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Pilih Protokol</label>
        <select id="protocol" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="vmess">VMess WebSocket</option>
          <option value="vless">VLess WebSocket</option>
          <option value="trojan">Trojan</option>
          <option value="ssh">SSH Direct</option>
        </select>
      </div>

      <!-- PILIHAN DURASI HARIAN (SLIDER & INPUT) -->
      <div class="bg-slate-750 p-3 rounded-lg border border-slate-700">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-semibold text-slate-300">Durasi Aktif (Maks 30 Hari)</label>
          <span id="labelDays" class="text-sm font-bold text-blue-400">30 Hari</span>
        </div>

        <input type="range" id="daysRange" min="1" max="30" value="30" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500" oninput="updatePrice(this.value)">

        <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-700/60">
          <span class="text-xs text-slate-400">Total Harga (Rp 300/hari):</span>
          <span id="displayPrice" class="text-lg font-bold text-emerald-400">Rp 9.000</span>
        </div>
      </div>

      <button onclick="handleCheckout()" id="btnBayar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition duration-200">
        Buat Tagihan QRIS
      </button>
    </div>

    <!-- TAMPILAN QRIS -->
    <div id="qrisSection" class="hidden text-center space-y-4">
      <div class="bg-white p-3 rounded-xl inline-block">
        <img id="qrisImg" src="" alt="QRIS" class="w-56 h-56 mx-auto object-contain">
      </div>
      <div>
        <div class="text-xs text-slate-400">Total Tagihan (<span id="qrisDaysText">30 Hari</span>):</div>
        <div id="qrisTotal" class="text-2xl font-bold text-emerald-400">Rp 0</div>
      </div>
      <div class="text-xs text-amber-300 animate-pulse">
        ⏳ Silakan scan QRIS di atas. Layar akan otomatis memunculkan akun Anda setelah pembayaran diverifikasi.
      </div>
    </div>

    <!-- HASIL CONFIG / AKUN -->
    <div id="resultSection" class="hidden space-y-4">
      <div class="p-3 bg-emerald-950/80 border border-emerald-500 text-emerald-300 rounded-lg text-center text-xs">
        ✅ Pembayaran Berhasil! Akun Anda aktif.
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Detail Config VPN:</label>
        <textarea id="credentialOutput" readonly rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 font-mono text-xs text-emerald-400 focus:outline-none"></textarea>
      </div>
      <button onclick="copyToClipboard()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-xs font-medium">
        Salin Config
      </button>
      <button onclick="location.reload()" class="w-full text-xs text-slate-400 hover:text-white underline">
        Beli Lagi
      </button>
    </div>
  </div>

  <script>
    const RATE_PER_DAY = 300; // Rp 9.000 / 30 hari
    let pollTimer = null;

    function updatePrice(val) {
      const days = parseInt(val, 10);
      const total = days * RATE_PER_DAY;
      document.getElementById('labelDays').innerText = `${days} Hari`;
      document.getElementById('displayPrice').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    async function handleCheckout() {
      const username = document.getElementById('username').value.trim();
      const protocol = document.getElementById('protocol').value;
      const days = parseInt(document.getElementById('daysRange').value, 10);
      const btn = document.getElementById('btnBayar');

      if (!username) return alert('Username wajib diisi!');

      btn.disabled = true;
      btn.innerText = 'Membuat QRIS...';

      try {
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, protocol, days })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('formSection').classList.add('hidden');
          document.getElementById('qrisSection').classList.remove('hidden');
          document.getElementById('qrisImg').src = data.qrImage;
          document.getElementById('qrisDaysText').innerText = `${data.days} Hari`;
          document.getElementById('qrisTotal').innerText = 'Rp ' + Number(data.amount).toLocaleString('id-ID');

          startPolling(data.orderId);
        } else {
          alert(data.error || 'Gagal membuat QRIS');
          btn.disabled = false;
          btn.innerText = 'Buat Tagihan QRIS';
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi');
        btn.disabled = false;
        btn.innerText = 'Buat Tagihan QRIS';
      }
    }

    function startPolling(orderId) {
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/check?orderId=${orderId}`);
          const data = await res.json();

          if (data.status === 'PAID') {
            clearInterval(pollTimer);
            document.getElementById('qrisSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');

            const out = typeof data.credentials === 'object'
              ? JSON.stringify(data.credentials, null, 2)
              : data.credentials;

            document.getElementById('credentialOutput').value = out || 'Akun berhasil dibuat.';
          }
        } catch (e) {
          console.error(e);
        }
      }, 3000);
    }

    function copyToClipboard() {
      const box = document.getElementById('credentialOutput');
      box.select();
      navigator.clipboard.writeText(box.value);
      alert('Config berhasil disalin!');
    }
  </script>
</body>
</html>
